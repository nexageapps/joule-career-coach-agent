apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: career-story-agent
  description: AI agent that turns an employee's SAP SuccessFactors profile, goals, performance reviews, skills, learning, and achievements into a personalised career story with strengths, skill gaps, and practical next steps.
  version: "1.0.0"

provides:
  apis:
    - name: career-story-agent
      kind: a2a
      ordId: customer.build:apiResource:career-story-agent-8d8c6.career-story-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
